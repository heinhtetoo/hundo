# Reference copy — NOT deployed from this repo.
#
# The live file is /etc/hundo/docker-compose.prod.yml on the OCI host
# (root:root 0644), edited there by hand. Secrets come from /etc/hundo/.env
# (root:root 0600). CI never writes either file: the deploy account runs a
# fixed forced command, which is what stops a compromised pipeline rewriting
# volume mounts to reach the host filesystem. See progress.md Phase 20.
#
# Compose derives the project name from the directory, so /etc/hundo gives
# project `hundo` and volume `hundo_postgres_data`. The deploy script also
# passes `-p hundo` explicitly.
services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hundo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/heinhtetoo/hundo/backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: >-
        postgresql://hundo_app:${HUNDO_APP_PASSWORD}@postgres:5432/hundo
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
