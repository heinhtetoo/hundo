# Live production config for Hundo. Installed to /etc/hundo by
# scripts/setup-deploy-host.sh — this file is the single source of truth.
#
# Applied BY HAND, never by CI. The compose file controls volume mounts, so a
# pipeline able to rewrite it could mount the host filesystem; a human running
# the provisioning script is a different trust level.
#
# Secrets come from /etc/hundo/.env (root:root 0600), generated on the host and
# never stored here.
#
# Compose derives the project name from the directory, so /etc/hundo gives
# project `hundo` and volume `hundo_postgres_data`. The deploy script also
# passes `-p hundo` explicitly.
services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hundo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/heinhtetoo/hundo/backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: >-
        postgresql://hundo_app:${HUNDO_APP_PASSWORD}@postgres:5432/hundo
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
